[project]
name = "file-change-service"
version = "0.1.0"
description = "Small FastAPI service for file-change workflow actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.2.12",
    "pyarrow>=24.0.0",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
